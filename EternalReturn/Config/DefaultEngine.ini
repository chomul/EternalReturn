+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="SkillTarget")
; Pawn 프로파일이 SkillTarget 에 응답하게 한다.
; C++ 에서 SetCollisionResponseToChannel 을 부르면 프로파일이 Custom 으로 바뀌고
; BP 저장값에 덮인다. 프로파일 자체를 고치는 게 맞다 (EditProfiles = engine profile override).
+EditProfiles=(Name="Pawn",CustomResponses=((Channel="SkillTarget",Response=ECR_Overlap)))
